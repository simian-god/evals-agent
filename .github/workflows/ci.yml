name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Windows is in the matrix because the evaluator runs inside whichever CLI
  # the builder uses, on whichever machine they have, and the harness reads
  # and writes paths on both.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

  # The Postgres world (Spec section 7) against a real Postgres, so its
  # tests run instead of skipping. They are the ones that prove a sequence
  # counts and a duplicate carries a SQLSTATE, which is the whole reason
  # that world exists.
  #
  # PostgREST is not here, so the tests for the recording client skip: they
  # need the client the subject actually talks to. That gap has a task.
  postgres:
    name: the Postgres world
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: harness
    env:
      EVALS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The database is created by this job and thrown away with it.
      EVALS_WORLD_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

  # The subject directory is the builder's, and the whole promise of this
  # repository is that it never publishes their agents or their data. A
  # workflow is the only thing that keeps checking after the first time
  # somebody is in a hurry.
  privacy:
    name: nothing of the builder's is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No subject is committed
        run: |
          tracked=$(git ls-files 'subjects/*' | grep -v '^subjects/README.md$' || true)
          if [ -n "$tracked" ]; then
            echo "These are tracked and should not be:"
            echo "$tracked"
            exit 1
          fi
          echo "subjects/ holds nothing but its README."

      - name: No run artifacts are committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(runs|authoring)/|\.events\.jsonl$|\.transcript\.md$' || true)
          if [ -n "$tracked" ]; then
            echo "These are tracked and should not be:"
            echo "$tracked"
            exit 1
          fi
          echo "No transcripts, events or authoring exports are tracked."

  # Adapters hold the environment a subject runs under, and a subject's .env
  # sits next to it. Over the full history, because a key removed in a later
  # commit is still published by the earlier one.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --redact --verbose

      - name: Scan the history
        run: gitleaks git . --redact --verbose
